services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: community
      POSTGRES_USER: community
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置随机数据库密码，建议 64 位十六进制}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U community -d community']
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      APP_ORIGIN: https://${APP_DOMAIN:?请设置域名}
      DATABASE_URL: postgresql://community:${POSTGRES_PASSWORD}@db:5432/community
      DATA_DIR: /data
      MODERATION_PROVIDER: none
      TRUST_PROXY: 'true'
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      CLAMAV_PORT: '3310'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/data
    expose: ['3000']
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?请设置域名}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [app]
  clamav:
    image: clamav/clamav:stable
    profiles: ['scanner']
    restart: unless-stopped
    volumes:
      - clamdata:/var/lib/clamav
    expose: ['3310']
    # Optional scanner must have current signatures. Give it at least 2 GiB extra RAM.
volumes:
  pgdata:
  uploads:
  caddydata:
  caddyconfig:
  clamdata:
